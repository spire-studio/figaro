[project]
name = "figaro"
version = "0.1.0"
description = "Figaro — An intelligent federated learning platform with AI-driven experiment orchestration"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "asyncpg>=0.30.0",
    "fastapi>=0.116.1",
    "grpcio>=1.76.0",
    "numpy>=2.0.1",
    "pydantic-settings>=2.10.1",
    "psycopg[binary]>=3.2.9",
    "protobuf>=6.31.1",
    "pyyaml>=6.0.3",
    "sqlalchemy>=2.0.43",
    "sqlmodel>=0.0.24",
    "tenseal>=0.3.16",
    "torch>=2.5.1",
    "torchvision>=0.20.1",
    "uvicorn>=0.35.0",
    "langgraph>=1.1.2",
    "langchain-openai>=1.0.0",
]

[dependency-groups]
dev = [
    "aiosqlite>=0.21.0",
    "httpx>=0.28.1",
    "pytest>=8.3.4",
]
