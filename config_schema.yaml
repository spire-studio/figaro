dataset:
  role: "server"
  name:
    type: "select"
    options: ["CIFAR-10", "CIFAR-100", "MNIST", "Fashion-MNIST"]
    default: "CIFAR-10"
  data_dir:
    type: "text"
    default: "./datasets"
  distribution:
    type: "select"
    options: ["iid", "non_iid"]
    default: "non_iid"
  alpha:
    type: "number"
    min: 0.1
    max: 10.0
    step: 0.1
    default: 0.5
    description: "Dirichlet分布参数"
    depends_on: "dataset.distribution == non_iid"
  num_clients:
    type: "number"
    min: 1
    max: 100
    default: 2
    hidden: true

model:
  role: "server"
  name:
    type: "select"
    options: ["CNN", "LeNet", "ResNet"]
    default: "CNN"
  input_shape:
    type: "list_int"
    default: [32, 32, 3]
  num_classes:
    type: "number"
    default: 10

federated:
  role: "server"
  num_clients:
    type: "number"
    min: 1
    max: 100
    default: 3
    hidden: true
  num_rounds:
    type: "number"
    default: 10
  clients_per_round:
    type: "number"
    default: 2
  local_epochs:
    type: "number"
    default: 5
  learning_rate:
    type: "number"
    step: 0.001
    default: 0.01
  aggregation:
    type: "select"
    options: ["fedavg", "fedprox", "scaffold"]
    default: "fedavg"
  seed:
    type: "number"
    default: 42
    description: "Random seed for full reproducibility (model init, data split, client selection)"

compression:
  role: "server"
  sparsification:
    enable:
      type: "bool"
      default: false
    ratio:
      type: "number"
      default: 0.5
      min: 0
      max: 1.0
      depends_on: "compression.sparsification.enable == true"

privacy:
  role: "server"
  homomorphic_encryption:
    enable:
      type: "bool"
      default: false
    poly_modulus_degree:
      type: "select"
      options: [4096, 8192, 16384]
      default: 8192
      depends_on: "privacy.homomorphic_encryption.enable == true"

system:
  hidden: true
  role: "server"
  mode:
    type: "select"
    options: ["simulation", "distributed"]
    default: "distributed"
  node_role:
    type: "select"
    options: ["server", "client"]
    default: "server"

distributed:
  role: "server"
  server_ip:
    type: "text"
    default: "localhost"
    depends_on: "system.mode == distributed"
  port:
    type: "number"
    default: 50052
    depends_on: "system.mode == distributed"
  client_id:
    type: "number"
    default: 0
    depends_on: "system.mode == distributed && system.node_role == client"

logging:
  role: "server"
  log_dir:
    type: "text"
    default: "./logs"
  save_results:
    type: "bool"
    default: true
  results_dir:
    type: "text"
    default: "./results"
