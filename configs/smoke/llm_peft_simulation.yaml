task:
  type: llm_peft_sft

system:
  mode: simulation
  node_role: server

llm:
  base_model: ./models/llm/tiny-causal-lm
  tokenizer: auto
  max_seq_length: 128
  precision: fp32

sft:
  dataset_path: ./configs/smoke/llm_peft/train.jsonl
  format: prompt_completion
  prompt_template: plain
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 1

peft:
  method: lora
  rank: 4
  alpha: 8
  dropout: 0.0
  target_modules: q_proj,v_proj
  resume_adapter_path: ""
  quantization: none

evaluation:
  enable: true
  dataset_path: ./configs/smoke/llm_peft/validation.jsonl
  max_samples: 4
  batch_size: 1

federated:
  num_clients: 2
  num_rounds: 1
  clients_per_round: 2
  local_epochs: 1
  learning_rate: 0.0002
  aggregation: fedavg
  seed: 42

logging:
  results_dir: ./results
  save_results: true

