dataset:
  name: CIFAR-10
  data_dir: ./datasets
  distribution: non_iid
  alpha: 0.5
  num_clients: 3
model:
  name: Auto
  input_shape:
  - 3
  - 32
  - 32
  num_classes: 10
federated:
  num_rounds: 10
  clients_per_round: 2
  local_epochs: 5
  learning_rate: 0.01
  aggregation: fedavg
  num_clients: 3
  seed: 42
compression:
  sparsification:
    enable: false
    method: global_topk
    ratio: 0.5
    threshold: 0.001
privacy:
  homomorphic_encryption:
    enable: false
    method: ckks
    poly_modulus_degree: 8192
  differential_privacy:
    enable: false
    clipping_norm: 1.0
    noise_multiplier: 0.0
  secure_aggregation:
    enable: false
    mask_std: 1.0
system:
  mode: simulation
  node_role: server
distributed:
  server_ip: localhost
  port: 50052
  client_id: 0
logging:
  log_dir: ./logs
  save_results: true
  results_dir: ./results
