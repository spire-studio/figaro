networks:
  figaro-dist-net:

volumes:
  figaro_dist_uv_cache:
  figaro_dist_pnpm_store:
  figaro_dist_pg_server:
  figaro_dist_pg_client0:
  figaro_dist_pg_client1:
  figaro_dist_frontend_server_node_modules:
  figaro_dist_frontend_client0_node_modules:
  figaro_dist_frontend_client1_node_modules:
